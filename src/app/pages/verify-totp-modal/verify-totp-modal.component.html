<div class="modal fade otp_modal" id="verify_totp_modal" tabindex="-1" role="dialog" aria-labelledby="addAgent"
  aria-hidden="true">
  <div class="modal-dialog modal-md" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="closeModal()">
          <span aria-hidden="true">×</span>
        </button>
      </div>
      <div class="modal-body verify_otp_modal_body text-center ">
        <form>
          <div class="form-group">
            <h3>Verification</h3>
            <img src="assets/images/otp-verification.png" alt="">
            <p>Please type the OTP you see in your Google Authenticator app to proceed with the login.</p>
            <ng-otp-input (onInputChange)="onOtpChange($event)"
              [config]="{length:6, allowNumbersOnly:true, isPasswordInput:true}"></ng-otp-input>

              </div>

          </div>
        </form>
      </div>

  </div>
</div>

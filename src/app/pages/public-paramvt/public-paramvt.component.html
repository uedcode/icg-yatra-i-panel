<div class="app-content">
  <div class="side-app">
    <div class="page-header gov-page-toolbar">
      <div class="page-leftheader">
        <h4 class="page-title">Video Tutorial</h4>
        <ol class="breadcrumb pl-0">
          <li class="breadcrumb-item"><a [routerLink]="['/support']">Support</a></li>
          <li class="breadcrumb-item active" aria-current="page">Video Tutorial</li>
        </ol>
      </div>
    </div>

    <div class="row">
      
        <div class="col-md-4 mb-3" *ngFor="let video of videos">
          <div class="card h-100">
            <div class="card-body">
              <video width="100%" height="220" controls>
                <source [src]="'data/static/' + video.file" type="video/mp4" />
              </video>
              <p class="mt-2 mb-0">
                <a [href]="'data/static/' + video.file" download>{{ video.title }}</a>
              </p>
            </div>
          </div>
        </div>
      
    </div>
  </div>
</div>

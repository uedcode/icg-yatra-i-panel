<div class="app-content">
  <div class="side-app">
    <div class="page-header gov-page-toolbar">
      <div class="page-leftheader">
        <h4 class="page-title">Version History</h4>
        <ol class="breadcrumb pl-0">
          <li class="breadcrumb-item"><a [routerLink]="['/login']">Login</a></li>
          <li class="breadcrumb-item active" aria-current="page">Version History</li>
        </ol>
      </div>
    </div>

    <div class="row">
      <div class="col-md-12 col-lg-12">
        <div id="accordion-public-version-history">
          <div class="card" *ngFor="let item of dataList; let i = index">
            <div class="card-header">
              <h5 class="mb-0">
                <span class="badge badge-secondary mr-2">{{ i + 1 }}</span>
                {{ item?.title || '-' }}
              </h5>
            </div>
            <div class="card-body">
              <p class="mb-2">{{ item?.descr || '-' }}</p>
              <small class="text-muted">Created On: {{ item?.createdOn | showDate:'medium' }}</small>
            </div>
          </div>
          <p class="text-center" *ngIf="!dataList.length">No Records</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="page-header gov-page-toolbar">
  <div class="page-leftheader">
    <h4 class="page-title">Port Rate</h4>
    <ol class="breadcrumb pl-0">
      <li class="breadcrumb-item"><a>Yatra</a></li>
      <li class="breadcrumb-item active" aria-current="page">Port Rate</li>
    </ol>
  </div>
  <div>
    <button type="button" class="btn btn-primary" (click)="dataObj={}" data-toggle="modal" data-target="#addportrate" title="Add">
      <i class="fa fa-plus"></i>
    </button>
  </div>
</div>

<div class="row">
  <div class="card">
    <div class="card-body">
      <div class="row">
        <div class="col-sm-12 col-md-6">
          <div class="dataTables_length">
            <label>Show</label>
            <select class="form-control" name="noOfPage" [(ngModel)]="noOfPage" (ngModelChange)="p=1">
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            <label>entries</label>
          </div>
        </div>
        <div class="col-sm-12 col-md-3 offset-3">
          <div class="dataTables_filter" title="Search">
            <i class="fa fa-search"></i>
            <input type="search" class="form-control form-control-sm" placeholder="Search" (keyup)="p=1" [(ngModel)]="searchObj" name="searchObj" />
          </div>
        </div>
      </div>
      <div class="table-responsive gov-table-wrap-premium table-wrap-premium">
        <table id="exportData" class="table table-bordered gov-table-sticky-first table-sticky-first" style="width:100%">
          <thead>
            <tr>
              <th class="wd-5p">S.No.</th>
              <th>From Station <i class="fa fa-sort" (click)="sort('from')"></i></th>
              <th>To Station <i class="fa fa-sort" (click)="sort('to')"></i></th>
              <th>Rate <i class="fa fa-sort" (click)="sort('rate')"></i></th>
              <th>Edit</th>
              <th>Delete</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let dataObj of dataList | filterComplex : searchObj | orderBy: key: reverse | paginate: { itemsPerPage: noOfPage, currentPage: p };let i=index">
              <td>{{ (i + 1) + (p - 1) * noOfPage }}.</td>
              <td>{{ dataObj?.from | showHypen }}</td>
              <td>{{ dataObj?.to | showHypen }}</td>
              <td>{{ dataObj?.rate | showHypen }}</td>
              <td>
                <button class="btn btn-primary" title="Edit" (click)="editRecord(dataObj)">
                  <i class="fa fa-edit"></i>
                </button>
              </td>
              <td>
                <button class="btn btn-danger" title="Delete" data-toggle="modal" data-target="#delete_modal" (click)="id=dataObj.yatPortRateId">
                  <i class="fa fa-trash"></i>
                </button>
              </td>
            </tr>
            <tr *ngIf="!dataList.length" class="text-center table-empty-state gov-table-empty-state">
              <td colspan="20">No Records</td>
            </tr>
            <tr class="noExl pagination_area" *ngIf="dataList?.length">
              <td colspan="20">
                <pagination-controls (pageChange)="p = $event"></pagination-controls>
              </td>
            </tr>
          </tbody>
        </table>
        <app-add-port-rate-modal [record]="dataObj" [dataList]="dataList" (setRecordData)="dataList = $event"></app-add-port-rate-modal>
        <app-delete-modal [deleteData]="id" (deleteConfirmed)="deleteList($event)"></app-delete-modal>
      </div>
    </div>
  </div>
</div>

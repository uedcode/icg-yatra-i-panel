<div class="modal fade" id="adddocuments" tabindex="-1" role="dialog" aria-hidden="true" data-keyboard="false" data-backdrop="static">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ formObj.docInfoId ? 'Update' : 'Add' }} Document</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="reset()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body form_modal_body">
        <form autocomplete="off" (ngSubmit)="mainForm.form.valid && saveRecord()" #mainForm="ngForm" novalidate>
          <div class="modal_form_sec">
            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label class="form-label">Document Name<sup class="required-msg">*</sup></label>
                  <input type="text" class="form-control" placeholder="eg. Proceeding Gx of the parent unit" maxlength="300" [(ngModel)]="formObj.docName" #docName="ngModel" name="docName" required>
                  <div *ngIf="docName.touched || (mainForm.submitted && docName.invalid)">
                    <div *ngIf="docName.errors?.required" class="invalid-msg">Document Name is required</div>
                  </div>
                </div>
              </div>

              <div class="col-md-2">
                <div class="form-group">
                  <label class="form-label d-block">LTC claim</label>
                  <input type="checkbox" name="ltcClaim" [checked]="formObj.ltcClaim === '1'" (change)="formObj.ltcClaim = $any($event.target).checked ? '1' : '0'">
                </div>
              </div>

              <div class="col-md-2">
                <div class="form-group">
                  <label class="form-label d-block">Permanent duty claim</label>
                  <input type="checkbox" name="pmtClaim" [checked]="formObj.pmtClaim === '1'" (change)="formObj.pmtClaim = $any($event.target).checked ? '1' : '0'">
                </div>
              </div>

              <div class="col-md-2">
                <div class="form-group">
                  <label class="form-label d-block">Temporary duty claim</label>
                  <input type="checkbox" name="tyClaim" [checked]="formObj.tyClaim === '1'" (change)="formObj.tyClaim = $any($event.target).checked ? '1' : '0'">
                </div>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <div class="text-right">
              <button type="submit" [disabled]="disableBtn" class="btn btn-primary">{{ formObj.docInfoId ? 'Update' : 'Submit' }}</button>
              <button type="button" class="btn btn-danger" title="Reset" (click)="reset()">Reset</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

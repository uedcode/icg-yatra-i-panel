<!--Page header-->
<div class="page-header gov-page-toolbar">
  <div class="page-leftheader">
    <h4 class="page-title">Draft</h4>
    <ol class="breadcrumb pl-0">
      <li class="breadcrumb-item"><a [routerLink]="['../dashboard']">Dashboard</a></li>
      <li class="breadcrumb-item active" aria-current="page">
        Draft
      </li>
    </ol>
  </div>
  <div>
    <div>
      <button type="button" class="btn btn-dark request_view_back"
        title="Back to Page" (click)="goBack()"><i
      class="fa fa-chevron-left" style="display: inline-block;"></i></button>
      <button type="button" class="btn btn-dark request_view_back" title="Filter" (click)="this.toggleFilter = !this.toggleFilter"><i
      class="fa fa-filter" style="display: inline-block;"></i></button>
    </div>

    <!-- <div class="breadcrumb_right">
    <button  type="submit" title="Submit" class="btn btn-dark"  (click)="openAddMapping()">+</button>
  </div> -->
</div>
</div>

  <div class="row" *ngIf="toggleFilter == true">
    <div class="col-md-12">
      <div class="card">
        <div class="card-body">
          <form class="page_form" autocomplete="off" (ngSubmit)="applyServerSearch()" novalidate>
            <div class="row">
              <div class="col-md-3">
                <div class="form-group">
                  <label class="form-label">Form ID</label>
                  <input type="text" class="form-control" name="formId" [(ngModel)]="filterObj.formId" placeholder="Form ID">
                </div>
              </div>
              <div class="col-md-3">
                <div class="form-group">
                  <label class="form-label">PNO</label>
                  <input type="text" class="form-control" name="pno" [(ngModel)]="filterObj.pno" placeholder="PNO">
                </div>
              </div>
              <div class="col-md-3">
                <div class="form-group">
                  <label class="form-label">Name</label>
                  <input type="text" class="form-control" name="searchedName" [(ngModel)]="filterObj.searchedName" placeholder="Name">
                </div>
              </div>
            </div>
            <div class="form_page_btn">
              <button type="submit" class="btn btn-primary"><i class="fa fa-check"></i> Submit</button>
              <button type="button" class="btn btn-danger" (click)="resetAdvancedFilters()"><i class="fa fa-refresh"></i> Reset</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

<div class="row">
  <div class="col-md-12 col-lg-12">
    <div class="card">
      <div class="card-body">
        <div class="row">
          <div class="col-sm-12 col-md-6">
            <div class="dataTables_length">
              <label>Show</label>
              <select class="form-control" name="noOfPage"
                aria-controls="example" [(ngModel)]="noOfPage"
                (ngModelChange)="p=1">
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
              <label>entries</label>
            </div>
          </div>

          <div class="col-sm-12 col-md-3 offset-3">
            <div class="dataTables_filter"  title="Search">
              <i class="fa fa-search"></i>
              <input type="search" class="form-control form-control-sm"
                placeholder="Search" (keyup)="p=1" (keyup.enter)="applyServerSearch()" (ngModelChange)="onSearchInput()"
                [(ngModel)]="searchObj" name="searchObj"
                aria-controls="example">
            </div>
          </div>
        </div>
        <div class="table-responsive gov-table-wrap-premium table-wrap-premium">
          <table id="exportData" class="table table-bordered gov-table-sticky-first table-sticky-first"
            style="width:100%">
            <thead>
              <tr>
                <th>S.No.</th>
                <th>Form Name</th>
                <th>Date</th>
                <th>Edit</th>
                <th>Delete</th>
              </tr>
            </thead>
            <tbody>
              
                <tr
                   *ngFor="let dataObj of dataList |  filterComplex : searchObj | orderBy: key: reverse  | paginate: { itemsPerPage: noOfPage, currentPage: p }; let i = index">
                  <td>{{ (i + 1) + (p - 1) * noOfPage}}</td>
                  <td>{{dataObj?.yatClaimDTO?.codeSubFormDTO?.descr | showHypen}} </td>
                  <td>{{dataObj?.yatClaimDTO?.updatedOn | showDate:"medium" }}</td>
                  <td>
                    <button class="btn btn-primary" title="Edit" (click)="actionPage(dataObj)">Edit</button>
                  </td>
                  <td>
                    <button [disabled]="dataObj.isFixed==1"
                      class="btn btn-danger"
                      (click)="setDeleteTarget(dataObj)"
                      data-toggle="modal" data-target="#delete_modal"
                    title="Delete">Delete</button>
                  </td>
                </tr>
              

              
                <tr class="text-center table-empty-state gov-table-empty-state" *ngIf="!dataList.length">
                  <td colspan="20">No Records</td>
                </tr>
              
              
                <tr class="noExl pagination_area"
                   *ngIf="dataList?.length">
                  <td colspan="20">
                    <pagination-controls (pageChange)="p = $event"></pagination-controls>
                  </td>
                </tr>
              
            </tbody>
          </table>
        </div>
      </div>
      </div><app-delete-modal [deleteData]="id" (deleteConfirmed)="deleteRow($event)"></app-delete-modal>
    </div>
  </div>

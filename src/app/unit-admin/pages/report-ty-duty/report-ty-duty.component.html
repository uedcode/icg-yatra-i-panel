<div class="page">
  <div class="page-main">
    <app-header></app-header>
    <app-sidebar></app-sidebar>

    <div class="app-content">
      <div class="side-app">
        <div class="page-header gov-page-toolbar">
          <div class="page-leftheader">
            <h4 class="page-title">Report TY Duty</h4>
            <ol class="breadcrumb pl-0">
              <li class="breadcrumb-item"><a [routerLink]="['../dashboard']">Dashboard</a></li>
              <li class="breadcrumb-item active" aria-current="page">Report TY Duty</li>
            </ol>
          </div>
          <div>
            <button type="button" class="btn btn-dark request_view_back" title="Back to Page" (click)="goBack()">
              <i class="fa fa-chevron-left" style="display: inline-block;"></i>
            </button>
          </div>
        </div>

        <div class="row">
          <div class="col-md-12 col-lg-12">
            <div class="card">
              <div class="card-body">
                <form class="page_form" (ngSubmit)="saveRecord()" novalidate autocomplete="off">
                  <div class="row">
                    <div class="col-md-3">
                      <div class="form-group">
                        <label class="form-label">P.No.<sup class="required-msg">*</sup></label>
                        <ngx-select
                          [items]="pnoList"
                          optionTextField="pno"
                          optionValueField="pid"
                          [(ngModel)]="formObj.pnoId"
                          name="pnoId"
                          placeholder="Select PNO"
                          [allowClear]="true"
                          (ngModelChange)="onPnoChange($event)">
                        </ngx-select>
                      </div>
                    </div>
                    <div class="col-md-3">
                      <div class="form-group">
                        <label class="form-label">Name</label>
                        <input
                          type="text"
                          class="form-control"
                          [ngModel]="formObj?.codeHrDataDTO?.nameDescr"
                          name="nameDescr"
                          disabled>
                      </div>
                    </div>
                    <div class="col-md-2">
                      <div class="form-group">
                        <label class="form-label">Rank</label>
                        <input
                          type="text"
                          class="form-control"
                          [ngModel]="formObj?.codeHrDataDTO?.rank"
                          name="rank"
                          disabled>
                      </div>
                    </div>
                    <div class="col-md-4 mt-5">
                      <button type="submit" class="btn btn-space btn-primary">Add</button>
                      <button type="button" class="btn btn-space btn-warning" (click)="resetForm()">Reset</button>
                    </div>
                  </div>
                </form>
              </div>
            </div>

            <div class="card">
              <div class="card-body">
                <div class="row">
                  <div class="col-sm-12 col-md-6">
                    <div class="dataTables_length">
                      <label>Show</label>
                      <select class="form-control" name="noOfPage" [(ngModel)]="noOfPage" (ngModelChange)="p = 1">
                        <option value="10">10</option>
                        <option value="100">100</option>
                        <option value="100000">All</option>
                      </select>
                      <label>entries</label>
                    </div>
                  </div>

                  <div class="col-sm-12 col-md-3 offset-3">
                    <div class="dataTables_filter" title="Search">
                      <i class="fa fa-search"></i>
                      <input
                        type="search"
                        class="form-control form-control-sm"
                        placeholder="Search"
                        (keyup)="p = 1"
                        [(ngModel)]="searchObj"
                        name="searchObj">
                    </div>
                  </div>
                </div>

                <div class="table-responsive gov-table-wrap-premium table-wrap-premium">
                  <table class="table table-bordered gov-table-sticky-first table-sticky-first" style="width:100%">
                    <thead>
                      <tr>
                        <th>SL</th>
                        <th>PNO <i class="fa fa-sort" (click)="sort('codeHrDataDTO.pno')"></i></th>
                        <th>Name <i class="fa fa-sort" (click)="sort('codeHrDataDTO.nameDescr')"></i></th>
                        <th>Rank <i class="fa fa-sort" (click)="sort('codeHrDataDTO.rank')"></i></th>
                        <th>Flag as TY Duty</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr *ngFor="let dataObj of dataList | filterComplex : searchObj | orderBy: key: reverse | paginate: { itemsPerPage: noOfPage, currentPage: p }; let i = index">
                        <td>{{ (i + 1) + (p - 1) * noOfPage }}</td>
                        <td>{{ dataObj?.codeHrDataDTO?.pno | showHypen }}</td>
                        <td>{{ dataObj?.codeHrDataDTO?.nameDescr | showHypen }}</td>
                        <td>{{ dataObj?.codeHrDataDTO?.rank | showHypen }}</td>
                        <td>
                          <button
                            type="button"
                            class="btn btn-sm"
                            [ngClass]="dataObj?.status === '1' ? 'btn-danger' : 'btn-info'"
                            (click)="openChangeStatusModal(dataObj, dataObj?.status === '1' ? '0' : '1')"
                            data-toggle="modal"
                            data-target="#change_status_modal">
                            {{ dataObj?.status === '1' ? 'Remove Flag' : 'Add Flag' }}
                          </button>
                        </td>
                      </tr>
                      <tr *ngIf="!dataList.length" class="text-center table-empty-state gov-table-empty-state">
                        <td colspan="5">No Records Available</td>
                      </tr>
                      <tr class="noExl pagination_area" *ngIf="dataList?.length">
                        <td colspan="5">
                          <pagination-controls (pageChange)="p = $event"></pagination-controls>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
        <app-footer></app-footer>
      </div>
    </div>
  </div>
</div>
<app-change-status-modal
  [changeData]="tempObj"
  (changeStatusConfirmed)="changeStatus($event)">
</app-change-status-modal>

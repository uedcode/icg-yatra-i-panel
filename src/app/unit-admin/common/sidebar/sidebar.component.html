<!--aside open-->
<aside class="app-sidebar">
  <div class="app-sidebar__user">
    <div class="dropdown user-pro-body text-center">
      <div class="user-pic">
        <img src="assets/images/user.png" alt="user-img" class="avatar-xl rounded-circle mb-1">
      </div>
      <div class="user-info">
        <h6 class="mb-1 text-dark">{{userIdDetails?.formId}}</h6>
        <h6 class="mb-1 text-dark">{{userIdDetails?.unitName}}</h6>
        <!-- <h6 *ngIf="userIdDetails?.userGroupName" class="mb-1 text-dark">{{userIdDetails?.userGroupName}}</h6> -->
      </div>
    </div>
  </div>
  <ul class="side-menu sidebar_page_scroll">
    <li>
      <a (click)="$auth.closeSidebar()" class="side-menu__item" routerLinkActive="active current"
        [routerLink]="['../unit-admin']"><i class="side-menu__icon fa fa-user"></i><span
          class="side-menu__label">Manage Unit Admin </span></a>
    </li>
    <li>
      <a (click)="$auth.closeSidebar()" class="side-menu__item" routerLinkActive="active current"
        [routerLink]="['../role']"><i class="side-menu__icon fa fa-users"></i><span
          class="side-menu__label">Manage Role </span></a>
    </li>
    <li>
      <a (click)="$auth.closeSidebar()" class="side-menu__item" routerLinkActive="active current"
        [routerLink]="['../update-pmt-unit']"><i class="side-menu__icon fa fa-refresh"></i><span
          class="side-menu__label">Update PMT Unit </span></a>
    </li>
    <li>
      <a (click)="$auth.closeSidebar()" class="side-menu__item" routerLinkActive="active current"
        [routerLink]="['../report-ty-duty']"><i class="side-menu__icon fa fa-file"></i><span
          class="side-menu__label">Report TY Duty </span></a>
    </li>
    <li>
      <a (click)="$auth.closeSidebar()" class="side-menu__item" routerLinkActive="active current"
        [routerLink]="['../manage-paylevel-transaction']"><i class="side-menu__icon fa fa-money"></i><span
          class="side-menu__label">Manage Paylevel </span></a>
    </li>

  </ul>
  <!-- <img src="assets/images/logo.png" alt="Yatra Logo" class="logo_in_sidebar"> -->
</aside>
<!--aside closed-->

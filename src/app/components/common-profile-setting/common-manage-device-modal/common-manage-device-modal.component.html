<div class="modal fade" id="manage_device_modal" tabindex="-1" role="dialog" aria-hidden="true" data-keyboard="false"
  data-backdrop="static">
  <div class="modal-dialog modal-lg " role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">List of Devices</h4>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">×</span>
        </button>
      </div>
      <div class="modal_form_sec">
        <div class="card">
          <div class="card-body">
            <div class="table-responsive">
              <div class="table col-md-12">
                <table id="exportData" class="table table-striped table-bordered" style="width:100%; ">
                  <thead>
                    <tr>
                      <th class="wd-5p">SL</th>
                      <th style="vertical-align: middle;">Nick Name</th>
                      <th style="vertical-align: middle;">Browser</th>
                      <th style="vertical-align: middle;">Created Date</th>
                      <th style="vertical-align: middle;">Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let dataObj of dataList;let i=index">
                      <td>{{i+1}}</td>
                      <td>{{dataObj?.descr | showHypen}}</td>
                      <td>{{dataObj?.browserName | showHypen}}</td>
                      <td>{{dataObj?.createdOn | showDate:"medium"}}</td>
                      <td>
                        <button class="btn btn-danger" title="delete" data-toggle="modal" data-target="#delete_modal"
                          (click)="id=dataObj.id" [disabled]="dataObj?.isDisabled">{{dataObj?.isDisabled ? 'Active ●' :
                          'Delete'}}</button>
                      </td>
                    </tr>
                    <tr *ngIf="!dataList.length" class="text-center">
                      <td colspan="3">No Records Available</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<app-delete-modal [deleteData]="id" (deleteConfirmed)="deleteList($event)"></app-delete-modal>

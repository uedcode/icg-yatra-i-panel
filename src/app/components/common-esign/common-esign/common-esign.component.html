<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body text-center p-4">
          <h3 class="mb-3">eSign Redirect</h3>
          <p *ngIf="gateway" class="mb-3">
            You are being redirected to the eMudhra authentication page.
          </p>
          <p *ngIf="!gateway" class="mb-3 text-danger">
            eSign transaction reference is missing.
          </p>

          <div *ngIf="gateway" class="mb-3">
            <div class="spinner-border text-primary" role="status">
              <span class="sr-only">Loading...</span>
            </div>
          </div>

          <p *ngIf="gateway" class="text-muted small mb-4">
            If the redirect does not start automatically, use the button below.
          </p>

          <button *ngIf="gateway" type="button" class="btn btn-primary mr-2" (click)="submitForm()">
            Continue To eSign
          </button>
          <button type="button" class="btn btn-outline-secondary" (click)="backToModule()">
            Back
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body text-center p-4">
          <h3 class="mb-3">eSign Redirect</h3>
          
            <p class="mb-3" *ngIf="gateway">
              You are being redirected to the eMudhra authentication page.
            </p>
          
          
            <p class="mb-3 text-danger" *ngIf="!gateway">
              eSign transaction reference is missing.
            </p>
          

          
            <div class="mb-3" *ngIf="gateway">
              <div class="spinner-border text-primary" role="status">
                <span class="sr-only">Loading...</span>
              </div>
            </div>
          

          
            <p class="text-muted small mb-4" *ngIf="gateway">
              If the redirect does not start automatically, use the button below.
            </p>
          

          
            <button type="button" class="btn btn-primary mr-2" (click)="submitForm()" *ngIf="gateway">
              Continue To eSign
            </button>
          
          <button type="button" class="btn btn-outline-secondary" (click)="backToModule()">
            Back
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<ngx-extended-pdf-viewer [src]="docUrl" *ngIf="docUrl"
useBrowserLocale="false"
[showStampEditor]="false"
[showTextEditor]="false"
[showDrawEditor]="false"
[showOpenFileButton]="false"
[showPrintButton]="false"
[textLayer]="true"
>
</ngx-extended-pdf-viewer>

<img src="{{imgUrl}}" alt="Image" *ngIf="imgUrl">
<button type="button" class="btn btn-info" (click)="download()"><i class="fa fa-download"></i> Download</button>

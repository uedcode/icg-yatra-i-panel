<div class="page-header gov-page-toolbar">
  <h4 class="page-title">Pay Inbox</h4>
</div>

<div class="card">
  <div class="card-body">
    <div class="row">
      <div class="col-sm-12 col-md-6">
        <div class="dataTables_length">
          <label>Show</label>
          <select class="form-control" name="noOfPage" [(ngModel)]="noOfPage" (ngModelChange)="p = 1">
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <label>entries</label>
        </div>
      </div>
      <div class="col-sm-12 col-md-3 offset-3">
        <div class="dataTables_filter" title="Search">
          <label>Search</label>
          <i class="fa fa-search"></i>
          <input
            type="search"
            class="form-control form-control-sm"
            placeholder="Search"
            (keyup)="p = 1"
            [(ngModel)]="searchObj"
            name="searchObj"
            />
        </div>
      </div>
    </div>

    <div class="table-responsive gov-table-wrap-premium table-wrap-premium">
      <table class="table table-striped table-bordered table-hover">
        <thead>
          <tr>
            <th>S.No.</th>
            <th>PNO/Name/Rank</th>
            <th>Document</th>
            
              <th *ngIf="showVerifierRemarkColumn">Verifier Remarks</th>
            
            <th>View</th>
          </tr>
        </thead>
        <tbody>
          
            <tr *ngFor="let row of dataList | filterComplex : searchObj | paginate: { itemsPerPage: noOfPage, currentPage: p }; let i = index">
              <td>{{ (i + 1) + (p - 1) * noOfPage }}.</td>
              <td>
                {{ row?.yatPayDetailsDTO?.pno }}/{{ row?.yatPayDetailsDTO?.name }}/{{ row?.yatPayDetailsDTO?.rank }}
              </td>
              <td>
                {{ row?.yatPayDetailsDTO?.docName }}:
                
                  <button
                    type="button"
                    class="btn btn-info btn-sm ml-2"
                    (click)="viewDocument(row)"
                     *ngIf="row?.yatPayDetailsDTO?.docUrl">
                    View
                  </button>
                
                
                  <span class="ml-2" *ngIf="!row?.yatPayDetailsDTO?.docUrl">-</span>
                
              </td>
              
                <td *ngIf="showVerifierRemarkColumn">
                  {{ row?.yatPayDetailsDTO?.verifier1Remark }}
                </td>
              
              <td>
                <button class="btn btn-info btn-sm" (click)="viewForm(row)">View</button>
              </td>
            </tr>
          
          
            <tr *ngIf="!dataList?.length">
              <td [attr.colspan]="showVerifierRemarkColumn ? 5 : 4" class="text-center table-empty-state gov-table-empty-state">No Records</td>
            </tr>
          
        </tbody>
      </table>
      <div class="pull-right">
        <pagination-controls (pageChange)="p = $event"></pagination-controls>

<!---Global-loader-->

<div class="page">
  <div class="page-main">
    <app-header></app-header>
    <!--aside open-->
    <app-sidebar></app-sidebar>
    <!--aside closed-->

    <div class="app-content" (click)="$auth.closeSidebar()">
      <div class="side-app">
        <!--Page header-->
        <div class="page-header mobile_page_header gov-page-toolbar">
          <div class="page-leftheader">
            <h4 class="page-title">
              <!-- <span *ngIf="userIdDetails?.groupName"> {{userIdDetails?.groupName}}</span>
              <span *ngIf="userIdDetails?.roleName"> ({{userIdDetails?.roleName}})</span> -->
              Dashboard
            </h4>
            <ol class="breadcrumb pl-0">
              <li class="breadcrumb-item">
                <a [routerLink]="['../dashboard']">Home</a>
              </li>
              <li class="breadcrumb-item active" aria-current="page">
                Dashboard
              </li>
            </ol>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <div class="row">
              <div class="col-sm-6 col-md-4 col-lg-3">
                <a [routerLink]="['../inbox']">
                  <div class="custom_card">
                    <div class="custom_card_body">
                      <i
                        class="fa fa-inbox icon_bg_user"
                        aria-hidden="true"
                      ></i>
                      <h2>{{ countObj?.inbox }}</h2>
                      <p>Inbox</p>
                    </div>
                  </div>
                </a>
              </div>

              <div class="col-lg-3 col-md-4 col-sm-6">
                <a [routerLink]="['../outbox']">
                  <div class="custom_card">
                    <div class="custom_card_body">
                      <i
                        class="fa fa-envelope-open icon_bg_user"
                        aria-hidden="true"
                      ></i>
                      <h2>{{ countObj?.outbox }}</h2>
                      <p>Outbox</p>
                    </div>
                  </div>
                </a>
              </div>
              <div class="col-lg-3 col-md-4 col-sm-6">
                <a [routerLink]="['../approved']">
                  <div class="custom_card">
                    <div class="custom_card_body">
                      <i
                        class="fa fa-check-circle icon_bg_user"
                        aria-hidden="true"
                      ></i>
                      <h2>{{ countObj?.approved }}</h2>
                      <p>Approved</p>
                    </div>
                  </div>
                </a>
              </div>
              <div class="col-lg-3 col-md-4 col-sm-6">
                <a [routerLink]="['../rejected']">
                  <div class="custom_card">
                    <div class="custom_card_body">
                      <i
                        class="fa fa-reply icon_bg_user"
                        aria-hidden="true"
                      ></i>
                      <h2>{{ countObj?.rejected }}</h2>
                      <p>Rejected</p>
                    </div>
                  </div>
                </a>
              </div>
              <div
                class="col-lg-3 col-md-4 col-sm-6"
                *ngIf="isVerifier()"
              >
                <a [routerLink]="['../passed']">
                  <div class="custom_card">
                    <div class="custom_card_body">
                      <i
                        class="fa fa-check icon_bg_user"
                        aria-hidden="true"
                      ></i>
                      <h2>{{ countObj?.passed }}</h2>
                      <p>Passed</p>
                    </div>
                  </div>
                </a>
              </div>
              <div
                class="col-lg-3 col-md-4 col-sm-6"
                *ngIf="isVerifier()"
              >
                <a [routerLink]="['../not-passed']">
                  <div class="custom_card">
                    <div class="custom_card_body">
                      <i
                        class="fa fa-times-circle icon_bg_user"
                        aria-hidden="true"
                      ></i>
                      <h2>{{ countObj?.notPassed }}</h2>
                      <p>Not Passed</p>
                    </div>
                  </div>
                </a>
              </div>
            </div>
          </div>
        </div>
        <app-footer></app-footer>
      </div>
    </div>
  </div>
</div>

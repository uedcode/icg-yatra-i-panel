            <h4 class="page-title">
              <!-- <span *ngIf="userIdDetails?.groupName"> {{userIdDetails?.groupName}}</span>

              Dashboard

        <div class="card">
          <div class="card-body">
            <div class="row">
              <div class="col-sm-6 col-md-4 col-lg-3">
                <a [routerLink]="['../inbox']">
                  <div class="custom_card">
                    <div class="custom_card_body">
                      <i
                        class="fa fa-inbox icon_bg_user"
                        aria-hidden="true"
                      ></i>
                      <h2>{{ countObj?.inbox }}</h2>
                      <p>Inbox</p>
                    </div>
                  </div>
                </a>
              </div>

              <div class="col-lg-3 col-md-4 col-sm-6">
                <a [routerLink]="['../outbox']">
                  <div class="custom_card">
                    <div class="custom_card_body">
                      <i
                        class="fa fa-envelope-open icon_bg_user"
                        aria-hidden="true"
                      ></i>
                      <h2>{{ countObj?.outbox }}</h2>
                      <p>Outbox</p>
                    </div>
                  </div>
                </a>
              </div>
              <!-- <div class="col-sm-6 col-md-4 col-lg-3">
                <div class="custom_card">

                    <h2>{{countObj?.draft}}</h2>
                    <p>Draft</p>
                  </div>
                </div>
              </div> -->
              <div class="col-lg-3 col-md-4 col-sm-6">
                <a [routerLink]="['../approved']">
                  <div class="custom_card">
                    <div class="custom_card_body">
                      <i
                        class="fa fa-check-circle icon_bg_user"
                        aria-hidden="true"
                      ></i>
                      <h2>{{ countObj?.approved }}</h2>
                      <p>Approved</p>
                    </div>
                  </div>
                </a>
              </div>
              <div class="col-lg-3 col-md-4 col-sm-6">
                <a [routerLink]="['../rejected']">
                  <div class="custom_card">
                    <div class="custom_card_body">
                      <i
                        class="fa fa-reply icon_bg_user"
                        aria-hidden="true"
                      ></i>
                      <h2>{{ countObj?.rejected }}</h2>
                      <p>Rejected</p>
                    </div>
                  </div>
                </a>
              </div>
              <div
                class="col-lg-3 col-md-4 col-sm-6"
                *ngIf="userIdDetails?.roleTypeId == 'VE'"
              >
                <a [routerLink]="['../passed']">
                  <div class="custom_card">
                    <div class="custom_card_body">
                      <i
                        class="fa fa-check icon_bg_user"
                        aria-hidden="true"
                      ></i>
                      <h2>{{ countObj?.passed }}</h2>
                      <p>Passed</p>
                    </div>
                  </div>
                </a>
              </div>
              <div
                class="col-lg-3 col-md-4 col-sm-6"
                *ngIf="userIdDetails?.roleTypeId == 'VE'"
              >
                <a [routerLink]="['../not-passed']">
                  <div class="custom_card">
                    <div class="custom_card_body">
                      <i
                        class="fa fa-times-circle icon_bg_user"
                        aria-hidden="true"
                      ></i>
                      <h2>{{ countObj?.notPassed }}</h2>
                      <p>Not Passed</p>
                    </div>
                  </div>
                </a>
              </div>
            </div>
          </div>
        </div>

<div class="page-header">
  <h4 class="page-title">Pay Outbox</h4>
</div>

<div class="card">
  <div class="card-body table-responsive">
    <table class="table table-striped table-bordered">
      <thead>
        <tr>
          <th>PNO/Name/Rank</th>
          <th>Document</th>
          <th>State</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of dataList | paginate: { itemsPerPage: noOfPage, currentPage: p }">
          <td>
            {{ row?.yatPayDetailsDTO?.pno || '-' }}/{{ row?.yatPayDetailsDTO?.name || '-' }}/{{ row?.yatPayDetailsDTO?.rank || '-' }}
          </td>
          <td>{{ row?.yatPayDetailsDTO?.docName || '-' }}</td>
          <td>{{ row?.claimState || row?.state || '-' }}</td>
          <td><button class="btn btn-info btn-sm" (click)="viewForm(row)">Open</button></td>
        </tr>
        <tr *ngIf="!dataList?.length">
          <td colspan="4" class="text-center">No pay outbox records found.</td>
        </tr>
      </tbody>
    </table>
    <pagination-controls (pageChange)="p = $event"></pagination-controls>
  </div>
</div>

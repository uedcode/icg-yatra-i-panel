<!-- View Remark Modal Starts -->
<div class="modal fade" id="view_remark_modal" tabindex="-1" role="dialog" aria-labelledby="addAgent" aria-hidden="true"
  data-keyboard="false" data-backdrop="static">
  <div class="modal-dialog modal-lg " role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="manage_user">{{remarkModalTitle ? remarkModalTitle : "Remarks"}}</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">×</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-md-12">
            <p *ngIf="!innerHtml">{{remark | showHypen}}</p>
            <div [innerHTML]="remark" *ngIf="innerHtml"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- View Remark Modal Ends -->

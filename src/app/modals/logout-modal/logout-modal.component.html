<!--Logout Modal Starts -->
<div class="modal fade delete_modal_" id="logoutModal" tabindex="-1" role="dialog" aria-labelledby="addAgent"
  aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">Logout</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-12">
                        <form>
                            <div class="form-group">
                                <h4 class="col-form-label text-center">Are you sure you want to logout?</h4>
                            </div>
                            <div class="com-md-12 text-center">
                                <button  type="submit" title="Submit" class="btn btn-space btn-primary" (click)="logout()">Yes</button>
                                <button type="button" class="btn btn-space btn-secondary"
                                    data-dismiss="modal">No</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!--Logout Modal Ends -->
